name: Publish container images

# Builds and pushes public container images to GitHub Container Registry (GHCR)
# on every v* tag. Uses the built-in GITHUB_TOKEN — no extra secrets required.
#
# Triggered directly by the v* tag (in parallel with release.yml), NOT by the
# `release: published` event: a release created by release.yml uses GITHUB_TOKEN,
# and GITHUB_TOKEN-authored events do not trigger other workflows (GitHub loop-
# prevention) — so a release-event trigger would silently never fire. Keying on
# the tag makes this robust whether the tag is pushed by a human or by auto-tag
# (with RELEASE_TOKEN). workflow_dispatch allows manual (re)builds for a tag.
#
# Images published:
#   ghcr.io/genentech/pinard:<version>           — the agent/worker image (régisseur,
#                                                   maître, and vendangeur/worker all run
#                                                   this same binary; role is selected by
#                                                   the args passed to `pinard`). Built
#                                                   from the root Dockerfile. Includes the
#                                                   vendored Node/Pi runtime, `aoc`, and a
#                                                   pinned `engram` binary (mem_* tools).
#   ghcr.io/genentech/pinard-backend:<version>   — k8s services image (webterm-gateway +
#                                                   memory services + static docs site),
#                                                   built from build/pinard-backend/Dockerfile.
#                                                   Does NOT include the aoc CLI/daemon or
#                                                   engram (see its own header comment).
#   ghcr.io/genentech/pinard-webterm-gateway:<version> — standalone gateway image,
#                                                   built from build/pinard-webterm-gateway/Dockerfile.
#
# Tags applied to each image:
#   <semver>   e.g. 0.61.0
#   latest
#
# ghcr.io/genentech/pinard is the OSS-only channel; it has no relationship to
# the separate internal-registry image built from build/pinard-backend/Dockerfile
# by a separate (internal-only) CI job. The two are deliberately named
# differently on GHCR to avoid the naming collision that existed when both the
# worker and the backend candidates were "pinard".

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v<semver> tag to build images for"
        required: true

permissions:
  contents: read
  packages: write   # push to ghcr.io

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/genentech/pinard

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build from the tag (workflow_dispatch passes it explicitly; a tag
          # push resolves via github.ref).
          ref: ${{ github.event.inputs.tag || github.ref }}
          # deps/babysitter is a git submodule; actions/checkout defaults to
          # not fetching submodules, which leaves it empty. dist/build.sh's
          # bootstrap only runs `git submodule update --init` as a fallback
          # when deps/babysitter/package.json is missing, and that fallback
          # can't work anyway since .dockerignore excludes .git from the
          # Docker build context — so the submodule must already be populated
          # by the time `docker build` runs.
          submodules: recursive

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          # Tags are "v<semver>" (e.g. v0.61.0); strip the leading "v".
          # workflow_dispatch supplies the tag via input; a tag push via ref_name.
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # ── Agent/worker image (root Dockerfile) ──────────────────────────────
      # Includes: vendored Node/Pi runtime, aoc, pinard-extensions, engram.
      - name: Build and push agent/worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_BASE }}:latest
          build-args: |
            GIT_REVISION=${{ github.sha }}
            VERSION=${{ steps.version.outputs.version }}
            BUILT_AT=${{ github.event.repository.updated_at }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      # ── k8s services image (build/pinard-backend/Dockerfile) ─────────────
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/pinard-backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-backend:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_BASE }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ── Standalone gateway image (build/pinard-webterm-gateway/Dockerfile) ─
      - name: Build and push webterm-gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/pinard-webterm-gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-webterm-gateway:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_BASE }}-webterm-gateway:latest
          cache-from: type=gha,scope=webterm-gateway
          cache-to: type=gha,mode=max,scope=webterm-gateway
