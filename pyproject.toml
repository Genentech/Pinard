[project]
name = "pinard"
version = "0.70.1"
description = "Pinard — AI agent orchestration (chart version; cz-bump owns v* tags)"
readme = "README.md"

# Chart version lineage — gpapy-asg-ci `.bump-chart` cz-bumps this on merges and
# cuts `v$version` git tags. Flux's app GitRepository picks the `charts/pinard`
# umbrella chart from the highest `v*` tag (semver *.*.*). This is now the single
# owner of `v*` tags (the release-pinard dist flow consumes these, no longer mints them).
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
bump_message = "bump chart $current_version → $new_version"
version_files = []
